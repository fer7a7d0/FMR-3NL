<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="Una partida rápida de tres en raya contra la inteligencia artificial.">
  <title>Tres en raya — juega una partida</title>
  <link rel="stylesheet" href="/globals.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Tres en raya, inicio"><span class="brand-mark" aria-hidden="true">tic</span> tres en raya</a>
      <div class="topbar-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false" title="Activar modo oscuro">
          <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <span class="topbar-note"><span class="online-dot" aria-hidden="true"></span> Juego local</span>
      </div>
    </header>

    <section class="game-layout" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow"><span>01</span> · CLÁSICO, SIN COMPLICACIONES</p>
        <h1 id="page-title">Tu siguiente<br><span>movimiento.</span></h1>
        <p class="intro-copy">Una partida rápida. Tú contra la máquina.</p>
      </div>

      <section class="game-panel" aria-label="Partida de tres en raya">
        <div class="panel-head">
          <div>
            <p class="eyebrow">PARTIDA ACTUAL</p>
            <p id="status" class="status" aria-live="polite">Tu turno <span class="turn-symbol">×</span></p>
          </div>
          <label class="difficulty-label" for="difficulty">NIVEL
            <select id="difficulty" aria-label="Nivel de dificultad">
              <option value="easy">Fácil</option>
              <option value="hard">Difícil</option>
            </select>
          </label>
        </div>

        <div class="board" id="board" role="group" aria-label="Tablero de tres en raya">
          <button class="cell" type="button" data-index="0" aria-label="Casilla 1, vacía"></button>
          <button class="cell" type="button" data-index="1" aria-label="Casilla 2, vacía"></button>
          <button class="cell" type="button" data-index="2" aria-label="Casilla 3, vacía"></button>
          <button class="cell" type="button" data-index="3" aria-label="Casilla 4, vacía"></button>
          <button class="cell" type="button" data-index="4" aria-label="Casilla 5, vacía"></button>
          <button class="cell" type="button" data-index="5" aria-label="Casilla 6, vacía"></button>
          <button class="cell" type="button" data-index="6" aria-label="Casilla 7, vacía"></button>
          <button class="cell" type="button" data-index="7" aria-label="Casilla 8, vacía"></button>
          <button class="cell" type="button" data-index="8" aria-label="Casilla 9, vacía"></button>
        </div>

        <div class="panel-foot">
          <p class="helper-text">Tú juegas con <strong>×</strong><span aria-hidden="true"> · </span>La máquina con <strong>○</strong></p>
          <button id="restart" class="restart-button" type="button"><span aria-hidden="true">↻</span> Nueva partida</button>
        </div>
      </section>

      <section class="score-section" aria-labelledby="score-title">
        <div class="score-heading"><p class="eyebrow" id="score-title">MARCADOR</p><span class="score-caption">Esta sesión</span></div>
        <div class="score-grid">
          <article class="score-item"><span class="score-symbol player-symbol" aria-hidden="true">×</span><span class="score-name">Tú</span><strong id="playerWins">0</strong></article>
          <article class="score-item"><span class="score-symbol ai-symbol" aria-hidden="true">○</span><span class="score-name">Máquina</span><strong id="aiWins">0</strong></article>
          <article class="score-item"><span class="score-symbol draw-symbol" aria-hidden="true">＝</span><span class="score-name">Empates</span><strong id="draws">0</strong></article>
        </div>
      </section>
    </section>
    <footer class="footer"><span>Una pausa bien jugada.</span><span>© TRES EN RAYA</span></footer>
  </main>

  <script>
    const board = document.getElementById('board');
    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');
    const restartButton = document.getElementById('restart');
    const difficultySelect = document.getElementById('difficulty');
    const playerWinsEl = document.getElementById('playerWins');
    const aiWinsEl = document.getElementById('aiWins');
    const drawsEl = document.getElementById('draws');
    const themeToggle = document.getElementById('theme-toggle');
    const themeColor = document.querySelector('meta[name="theme-color"]');

    function setTheme(isDark) {
      document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      themeToggle.setAttribute('aria-pressed', String(isDark));
      const action = isDark ? 'Activar modo claro' : 'Activar modo oscuro';
      themeToggle.setAttribute('aria-label', action);
      themeToggle.title = action;
      themeColor.content = isDark ? '#141512' : '#f5f5f2';
    }

    setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
    themeToggle.addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme !== 'dark');
    });

    let gameBoard = ['', '', '', '', '', '', '', '', ''];
    let gameActive = true;
    let aiThinking = false;
    let aiTimer;
    let playerWins = 0;
    let aiWins = 0;
    let draws = 0;

    const winningCombinations = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    cells.forEach((cell) => {
      cell.addEventListener('click', () => {
        const index = Number(cell.dataset.index);
        if (gameBoard[index] !== '' || !gameActive || aiThinking) return;
        makeMove(index, 'X');
        if (gameActive) {
          aiThinking = true;
          cells.forEach((button) => button.disabled = true);
          status.textContent = 'La máquina está pensando…';
          aiTimer = window.setTimeout(aiMove, 420);
        }
      });
    });

    function makeMove(index, player) {
      gameBoard[index] = player;
      const cell = cells[index];
      cell.textContent = player === 'X' ? '×' : '○';
      cell.classList.add(player === 'X' ? 'is-player' : 'is-ai');
      cell.setAttribute('aria-label', `Casilla ${index + 1}, ${player === 'X' ? 'tuya' : 'de la máquina'}`);

      if (checkWin(player)) {
        status.textContent = player === 'X' ? 'Has ganado.' : 'La máquina gana.';
        gameActive = false;
        updateCounters(player);
        return;
      }
      if (gameBoard.every((value) => value !== '')) {
        status.textContent = 'Empate. Buena partida.';
        gameActive = false;
        updateCounters('Draw');
        return;
      }
      status.textContent = player === 'X' ? 'Turno de la máquina' : 'Tu turno';
    }

    function updateCounters(winner) {
      if (winner === 'X') playerWinsEl.textContent = ++playerWins;
      else if (winner === 'O') aiWinsEl.textContent = ++aiWins;
      else drawsEl.textContent = ++draws;
    }

    function aiMove() {
      if (!gameActive) return;
      const move = difficultySelect.value === 'easy' ? getEasyMove() : minimax(gameBoard, 'O').index;
      if (move !== undefined && move !== null) makeMove(move, 'O');
      aiThinking = false;
      cells.forEach((button, index) => button.disabled = !gameActive || gameBoard[index] !== '');
    }

    function getEasyMove() {
      const winningMove = findBestMove('O');
      if (winningMove !== null) return winningMove;
      const blockingMove = findBestMove('X');
      if (blockingMove !== null) return blockingMove;
      const emptyCells = gameBoard.map((value, index) => value === '' ? index : null).filter((index) => index !== null);
      return emptyCells[Math.floor(Math.random() * emptyCells.length)];
    }

    function minimax(state, player) {
      const emptyCells = state.map((value, index) => value === '' ? index : null).filter((index) => index !== null);
      if (checkWinState(state, 'X')) return { score: -10 };
      if (checkWinState(state, 'O')) return { score: 10 };
      if (emptyCells.length === 0) return { score: 0 };
      const moves = emptyCells.map((index) => {
        state[index] = player;
        const score = minimax(state, player === 'O' ? 'X' : 'O').score;
        state[index] = '';
        return { index, score };
      });
      return moves.reduce((best, move) => player === 'O' ? (move.score > best.score ? move : best) : (move.score < best.score ? move : best));
    }

    function checkWinState(state, player) {
      return winningCombinations.some((combination) => combination.every((index) => state[index] === player));
    }

    function findBestMove(player) {
      for (const [a, b, c] of winningCombinations) {
        if (gameBoard[a] === player && gameBoard[b] === player && gameBoard[c] === '') return c;
        if (gameBoard[a] === player && gameBoard[c] === player && gameBoard[b] === '') return b;
        if (gameBoard[b] === player && gameBoard[c] === player && gameBoard[a] === '') return a;
      }
      return null;
    }

    function checkWin(player) {
      return checkWinState(gameBoard, player);
    }

    restartButton.addEventListener('click', () => {
      window.clearTimeout(aiTimer);
      gameBoard = ['', '', '', '', '', '', '', '', ''];
      gameActive = true;
      aiThinking = false;
      status.textContent = 'Tu turno ×';
      cells.forEach((cell, index) => {
        cell.textContent = '';
        cell.disabled = false;
        cell.classList.remove('is-player', 'is-ai');
        cell.setAttribute('aria-label', `Casilla ${index + 1}, vacía`);
      });
    });
  </script>
</body>
</html>
