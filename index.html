<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101510">
  <meta name="description" content="Una partida rápida de tres en raya. Pon a prueba tu estrategia contra la inteligencia artificial.">
  <title>Tres en raya — juega tu siguiente movimiento</title>
  <style>
    :root{color-scheme:dark;--bg:#101510;--surface:#191f19;--surface-raised:#202820;--line:#303a30;--text:#f1f4ec;--muted:#9aa596;--lime:#c6f36b;--lime-ink:#17200d;--rose:#ff8b83;--radius:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#273222 0,transparent 42%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px 18px 32px}button,select{font:inherit}button:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:4px}
    .app{width:min(100%,500px)}.topline{display:flex;align-items:center;justify-content:space-between;margin:0 2px 25px}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:750;letter-spacing:.11em;text-transform:uppercase}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--lime);color:var(--lime-ink);font-weight:900;font-size:19px;letter-spacing:-.1em}.online{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.online:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px #c6f36b88}
    .card{padding:clamp(22px,6vw,34px);border:1px solid #ffffff0c;border-radius:30px;background:linear-gradient(155deg,#1a211a 0%,#151a15 65%);box-shadow:0 32px 90px #0005}.intro{text-align:center}.eyebrow{margin:0 0 9px;color:var(--lime);font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:clamp(30px,8vw,42px);line-height:1.08;letter-spacing:-.055em}.subtitle{margin:10px 0 25px;color:var(--muted);font-size:14px}
    .scoreboard{display:grid;grid-template-columns:repeat(3,1fr);padding:13px 6px;margin-bottom:20px;border:1px solid var(--line);border-radius:18px;background:#111611}.score{display:grid;gap:3px;text-align:center}.score+.score{border-left:1px solid var(--line)}.score-value{font-size:22px;font-weight:750;letter-spacing:-.04em}.score-label{color:var(--muted);font-size:11px}.score:first-child .score-value{color:var(--lime)}
    .game-meta{min-height:45px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.turn{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:650}.turn-symbol{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--surface-raised);color:var(--lime);font-size:16px;font-weight:800}.turn-symbol.o{color:var(--rose)}.difficulty{height:42px;padding:0 33px 0 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-raised);color:var(--text);font-size:12px;cursor:pointer}
    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;aspect-ratio:1}.cell{display:grid;place-items:center;min-width:0;border:1px solid #ffffff0b;border-radius:18px;background:#222a22;color:var(--lime);font-size:clamp(44px,15vw,76px);font-weight:650;line-height:1;cursor:pointer;transition:transform .16s ease,background .16s ease,border-color .16s ease}.cell:not(:disabled):hover{transform:translateY(-2px);background:#293329;border-color:#c6f36b55}.cell:disabled{cursor:default}.cell.o{color:var(--rose)}.cell.winner{background:#c6f36b1c;border-color:var(--lime);box-shadow:inset 0 0 25px #c6f36b12}.cell:disabled:focus-visible{outline-offset:2px}
    .actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}.primary,.icon-button{height:48px;border:0;border-radius:14px;cursor:pointer;font-weight:700;transition:transform .15s ease,filter .15s ease}.primary{background:var(--lime);color:var(--lime-ink)}.primary:hover,.icon-button:hover{filter:brightness(1.08);transform:translateY(-1px)}.icon-button{display:grid;place-items:center;width:48px;background:var(--surface-raised);color:var(--text);border:1px solid var(--line)}.icon-button svg{width:19px;height:19px}.hint{margin:17px 0 0;text-align:center;color:var(--muted);font-size:11px}.hint kbd{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-raised);font:inherit;color:var(--text)}
    @media(max-width:380px){body{padding:16px 12px}.card{padding:20px 16px;border-radius:24px}.cell{border-radius:14px;gap:7px}.scoreboard{margin-bottom:15px}.subtitle{margin-bottom:20px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topline"><div class="brand"><span class="brand-mark" aria-hidden="true">×o</span><span>Juegos de bolsillo</span></div><span class="online">Lista para jugar</span></header>
    <section class="card" aria-labelledby="title">
      <div class="intro"><p class="eyebrow">Un clásico, sin vueltas</p><h1 id="title">Tres en raya</h1><p class="subtitle">¿Puedes vencer a la máquina?</p></div>
      <section class="scoreboard" aria-label="Marcador de la sesión">
        <div class="score"><span class="score-value" id="playerWins">0</span><span class="score-label">Tú</span></div>
        <div class="score"><span class="score-value" id="draws">0</span><span class="score-label">Empates</span></div>
        <div class="score"><span class="score-value" id="aiWins">0</span><span class="score-label">Máquina</span></div>
      </section>
      <div class="game-meta"><div class="turn" aria-live="polite" aria-atomic="true"><span class="turn-symbol" id="turnSymbol" aria-hidden="true">×</span><span id="status">Tu turno</span></div><label class="sr-only" for="difficulty">Dificultad</label><select class="difficulty" id="difficulty" aria-label="Dificultad"><option value="easy">Fácil</option><option value="hard">Imbatible</option></select></div>
      <div class="board" id="board" role="grid" aria-label="Tablero de tres en raya"></div>
      <div class="actions"><button class="primary" id="restart" type="button">Nueva partida</button><button class="icon-button" id="resetScore" type="button" aria-label="Reiniciar marcador" title="Reiniciar marcador"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button></div>
      <p class="hint">Elige una casilla para empezar <span aria-hidden="true">·</span> El marcador se reinicia al recargar</p>
    </section>
  </main>
  <script>
    const boardElement=document.getElementById('board');
    const statusElement=document.getElementById('status');
    const turnSymbol=document.getElementById('turnSymbol');
    const difficultySelect=document.getElementById('difficulty');
    const cells=[];
    const winningLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let gameBoard=Array(9).fill('');
    let gameActive=true;
    let aiTimer=null;
    const scores={X:0,O:0,draw:0};

    for(let index=0;index<9;index++){
      const cell=document.createElement('button');
      cell.type='button';cell.className='cell';cell.setAttribute('role','gridcell');
      cell.setAttribute('aria-label',`Fila ${Math.floor(index/3)+1}, columna ${index%3+1}, vacía`);
      cell.addEventListener('click',()=>play(index));
      boardElement.append(cell);cells.push(cell);
    }
    function winner(state,player){return winningLines.find(line=>line.every(index=>state[index]===player))||null;}
    function setStatus(message,symbol='×'){
      statusElement.textContent=message;turnSymbol.textContent=symbol;
      turnSymbol.classList.toggle('o',symbol==='○');
    }
    function paintCell(index,player){
      const mark=player==='X'?'×':'○';
      cells[index].textContent=mark;cells[index].classList.toggle('o',player==='O');
      cells[index].setAttribute('aria-label',`Fila ${Math.floor(index/3)+1}, columna ${index%3+1}, ${player==='X'?'tú':'máquina'}: ${mark}`);
      cells[index].disabled=true;
    }
    function finish(player,line){
      gameActive=false;
      if(line){line.forEach(index=>cells[index].classList.add('winner'));scores[player]++;setStatus(player==='X'?'¡Ganaste!':'La máquina gana',player==='X'?'×':'○');}
      else{scores.draw++;setStatus('¡Empate!','•');}
      document.getElementById('playerWins').textContent=scores.X;
      document.getElementById('aiWins').textContent=scores.O;
      document.getElementById('draws').textContent=scores.draw;
    }
    function move(index,player){
      gameBoard[index]=player;paintCell(index,player);
      const line=winner(gameBoard,player);
      if(line||gameBoard.every(Boolean)){finish(player,line);return false;}
      setStatus(player==='X'?'Turno de la máquina':'Tu turno',player==='X'?'○':'×');return true;
    }
    function play(index){
      if(!gameActive||gameBoard[index])return;
      if(move(index,'X'))aiTimer=setTimeout(aiMove,330);
    }
    function minimax(state,player,depth=0){
      const won=winner(state,'O');if(won)return {score:10-depth};
      if(winner(state,'X'))return {score:depth-10};
      const empty=state.map((cell,index)=>cell===''?index:null).filter(index=>index!==null);
      if(!empty.length)return {score:0};
      let best={score:player==='O'?-Infinity:Infinity,index:empty[0]};
      for(const index of empty){state[index]=player;const result=minimax(state,player==='O'?'X':'O',depth+1);state[index]='';
        if((player==='O'&&result.score>best.score)||(player==='X'&&result.score<best.score))best={score:result.score,index};}
      return best;
    }
    function aiMove(){
      if(!gameActive)return;
      const empty=gameBoard.map((cell,index)=>cell===''?index:null).filter(index=>index!==null);
      let index;
      if(difficultySelect.value==='hard')index=minimax(gameBoard.slice(),'O').index;
      else{
        const winningMove=findImmediate('O')??findImmediate('X');
        index=winningMove??empty[Math.floor(Math.random()*empty.length)];
      }
      if(index!==undefined)move(index,'O');
    }
    function findImmediate(player){
      for(const line of winningLines){const open=line.filter(index=>gameBoard[index]==='');if(open.length===1&&line.filter(index=>gameBoard[index]===player).length===2)return open[0];}
      return null;
    }
    function newGame(){
      clearTimeout(aiTimer);gameBoard=Array(9).fill('');gameActive=true;
      cells.forEach((cell,index)=>{cell.textContent='';cell.disabled=false;cell.classList.remove('o','winner');cell.setAttribute('aria-label',`Fila ${Math.floor(index/3)+1}, columna ${index%3+1}, vacía`);});
      setStatus('Tu turno');cells[0].focus();
    }
    document.getElementById('restart').addEventListener('click',newGame);
    document.getElementById('resetScore').addEventListener('click',()=>{
      scores.X=0;scores.O=0;scores.draw=0;
      document.getElementById('playerWins').textContent='0';document.getElementById('aiWins').textContent='0';document.getElementById('draws').textContent='0';newGame();
    });
  </script>
</body>
</html>
